name: Sync Strava

# Ogni mattina scarica le attività da Strava e fa un commit di data/.
# Il codice sta in my-strava; qui servono solo i secret STRAVA_CLIENT_ID,
# STRAVA_CLIENT_SECRET e STRAVA_REFRESH_TOKEN (vedi setup.md di my-strava).
on:
  schedule:
    - cron: "7 5 * * *"  # ogni giorno alle 05:07 UTC: le 06:07 in Italia d'inverno, le 07:07 d'estate
  workflow_dispatch:
    inputs:
      completo:
        description: Riscarica tutte le attività (per quelle inserite su Strava con più di due settimane di ritardo)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    uses: ama-eddy/my-strava/.github/workflows/sync.yml@v2
    with:
      completo: ${{ inputs.completo == true }}
    secrets: inherit
