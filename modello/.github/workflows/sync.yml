name: Sync Strava

# Ogni lunedì scarica le attività da Strava e fa un commit di data/.
# Il codice sta in my-strava; qui servono solo i secret STRAVA_CLIENT_ID,
# STRAVA_CLIENT_SECRET e STRAVA_REFRESH_TOKEN (vedi setup.md di my-strava).
on:
  schedule:
    - cron: "3 7 * * 1"  # lunedì 07:03 UTC
  workflow_dispatch:
    inputs:
      completo:
        description: Riscarica tutte le attività (per quelle inserite su Strava con più di due settimane di ritardo)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    uses: ama-eddy/my-strava/.github/workflows/sync.yml@v1
    with:
      completo: ${{ inputs.completo == true }}
    secrets: inherit
