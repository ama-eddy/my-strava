name: Pages

# Pubblica sito/ con GitHub Pages a ogni push su main che tocca le pagine.
# Nel sito ci sono solo le pagine e i dati di esempio: i dati veri restano nel repo di dati.
on:
  push:
    branches: [main]
    paths: ["sito/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: sito
      - id: deploy
        uses: actions/deploy-pages@v4
